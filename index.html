<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot Gemini</title>

  <!-- Flowbite / Tailwind CSS untuk tampilan rapi -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex flex-col h-screen">

  <!-- Header -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 text-center font-bold text-lg">
    🤖 AI Chat Gemini
  </header>

  <!-- Box Percakapan -->
  <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full">
    <div class="bg-slate-800 p-3 rounded-lg max-w-[80%] text-slate-200">
      Halo! Ada yang bisa saya bantu hari ini?
    </div>
  </main>

  <!-- Form Input -->
  <footer class="p-4 bg-slate-800 border-t border-slate-700">
    <form id="chat-form" class="flex gap-2 max-w-2xl mx-auto">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ketik pesan di sini..." 
        required 
        class="flex-1 bg-slate-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <button 
        type="submit" 
        class="bg-blue-600 hover:bg-blue-700 font-semibold px-5 py-2 rounded-lg transition"
      >
        Kirim
      </button>
    </form>
  </footer>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      // Tampilkan pesan User
      appendMessage(message, 'user');
      input.value = '';

      // Tampilkan indikator Loading
      const loadingDiv = appendMessage('Sedang berpikir...', 'ai', true);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();
        loadingDiv.remove();

        if (data.reply) {
          appendMessage(data.reply, 'ai');
        } else {
          appendMessage(data.error || 'Terjadi kesalahan pada server.', 'ai');
        }
      } catch (err) {
        loadingDiv.remove();
        appendMessage('Gagal terhubung ke server.', 'ai');
      }
    });

    function appendMessage(text, sender, isLoading = false) {
      const div = document.createElement('div');
      div.className = sender === 'user' 
        ? 'bg-blue-600 p-3 rounded-lg max-w-[80%] ml-auto text-white' 
        : 'bg-slate-800 p-3 rounded-lg max-w-[80%] text-slate-200';
      
      div.innerText = text;
      if (isLoading) div.classList.add('animate-pulse', 'italic');
      
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
